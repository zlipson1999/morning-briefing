name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch supersedes the first — no point burning
# runners on a commit nobody will look at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Catches what the others can't: a route that only fails to compile once
      # Next traces it, and any accidental client/server boundary crossing.
      - name: Build
        run: npm run build
